<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="title">小動畫家畫的完嗎?計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a cut bag sheet; red-pencil accent for the verdict, blue-pencil for secondary marks */
:root{
  --bg:#f6f7f4; --paper:#ffffff; --ink:#1f2a33; --muted:#5e6b75; --rule:#d9dfe3;
  --red:#c63a2f; --blue:#2f5f9e; --ok:#2e7d4f; --warn:#b7791f; --bad:#c63a2f;
  --field:#f9faf8;
  --f-body:"Noto Sans TC","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a1f; --paper:#1d242b; --ink:#e6eaed; --muted:#9aa7b1; --rule:#33404a;
  --red:#ef6b5f; --blue:#7ea6e0; --ok:#5fc08a; --warn:#e2a948; --bad:#ef6b5f; --field:#232c34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a1f; --paper:#1d242b; --ink:#e6eaed; --muted:#9aa7b1; --rule:#33404a;
  --red:#ef6b5f; --blue:#7ea6e0; --ok:#5fc08a; --warn:#e2a948; --bad:#ef6b5f; --field:#232c34; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px;display:grid;gap:14px}
.sheet h2{font-size:.78rem;letter-spacing:.12em;color:var(--blue);margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select{font:inherit;font-family:var(--f-num);font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.unit{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.verdict{display:grid;gap:12px;border-left:4px solid var(--state,var(--muted))}
.verdict .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.stamp{font-size:1.6rem;font-weight:700;color:var(--state,var(--ink));letter-spacing:.04em}
.why{color:var(--muted);font-size:.9rem;min-width:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.num{display:grid;gap:2px}
.num b{font-family:var(--f-num);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.num span{font-size:.78rem;color:var(--muted)}
.bar{height:10px;background:var(--field);border:1px solid var(--rule);border-radius:3px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td{padding:4px 0;border-bottom:1px dashed var(--rule)}
td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:.85rem;color:var(--blue);font-weight:500}
details[open] summary{margin-bottom:12px}
.note{font-size:.78rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:.85rem;background:transparent;color:var(--blue);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center}
.cal button{display:grid;gap:0;justify-items:center;padding:6px 2px;color:var(--ink);background:var(--field);font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.2;min-width:0}
.cal button small{font-family:var(--f-body);font-size:.68rem;color:var(--muted)}
.cal button.off{background:transparent;color:var(--muted);text-decoration:line-through;border-style:dashed}
.cal button.off small{color:var(--red);text-decoration:none}
.cal button.dl{border-color:var(--red)}
.cal .pad{visibility:hidden}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chk input{width:auto}
.alerts{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:.85rem}
.alerts li{color:var(--warn)}
.alerts li.bad{color:var(--bad)}
.say{font-size:.9rem;margin:0}
.say b{font-weight:700}
.langsel{display:block;width:auto;flex:none}
.langsel select{width:auto;font-family:var(--f-body);font-size:.85rem;padding:5px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <h1 data-i18n="title">小動畫家畫的完嗎?計算機</h1>
      <label for="lang" class="langsel"><span class="sr" data-i18n="langLabel">語言</span>
        <select id="lang"><option value="auto">Auto</option><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select>
      </label>
    </div>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <section class="sheet verdict" id="verdict" aria-live="polite">
    <div class="head"><span class="stamp" id="stamp">—</span><span class="why" id="why"></span></div>
    <div class="nums">
      <div class="num"><b id="nNeed">0</b><span data-i18n="nNeedL"></span></div>
      <div class="num"><b id="nAvail">0</b><span data-i18n="nAvailL"></span></div>
      <div class="num"><b id="nSlack">0</b><span data-i18n="nSlackL"></span></div>
    </div>
    <div class="bar" role="img" id="bar" data-i18n-aria="barAria"><i id="bLoad" style="background:var(--blue)"></i><i id="bNeed" style="background:var(--red)"></i></div>
    <div class="legend"><span><em style="background:var(--blue)"></em><span data-i18n="legLoad"></span></span><span><em style="background:var(--red)"></em><span data-i18n="legNew"></span></span><span><em style="background:var(--field);border:1px solid var(--rule)"></em><span>空き</span></span></div>
    <p class="say" id="say"></p>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <section class="sheet">
    <h2 data-i18n="h2new"></h2>
    <div class="grid">
      <label for="qDouga">動画 <span class="unit" data-i18n="uSheet"></span><input id="qDouga" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="qShiage">仕上 <span class="unit" data-i18n="uSheet"></span><input id="qShiage" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="qGentore">清書 <span class="unit" data-i18n="uSheet"></span><input id="qGentore" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="cpx"><span data-i18n="lCpx"></span>
        <select id="cpx"><option value="easy">簡単</option><option value="normal">普通</option><option value="hard">難しい</option><option value="extreme">ハード</option></select>
      </label>
    </div>
    <div class="row">
      <label class="chk" for="gaichu"><input id="gaichu" type="checkbox"><span data-i18n="chkGaichu"></span></label>
      <label class="chk" for="redo"><input id="redo" type="checkbox"><span data-i18n="chkRedo"></span></label>
      <label class="chk" for="hasRisk"><input id="hasRisk" type="checkbox"><span data-i18n="chkRisk"></span></label>
    </div>
    <div class="grid">
      <label for="deadline"><span data-i18n="lDeadline"></span><input id="deadline" type="datetime-local"></label>
      <label for="load"><span data-i18n="lLoad"></span> <span class="unit">hr</span><input id="load" type="number" min="0" step="0.5"></label>
      <label for="loadHard"><span data-i18n="lLoadHard"></span> <span class="unit">hr</span><input id="loadHard" type="number" min="0" step="0.5"></label>
    </div>
  </section>

  <section class="sheet">
    <div class="row" style="justify-content:space-between"><h2 data-i18n="h2days"></h2><span class="note" data-i18n="daysHint"></span></div>
    <div class="cal" id="cal"></div>
    <p class="note" id="calNote"></p>
  </section>

  <section class="sheet">
    <h2 data-i18n="h2break"></h2>
    <table><tbody id="breakdown"></tbody></table>
  </section>

  <section class="sheet">
    <details id="settingsBox">
      <summary data-i18n="sumSettings"></summary>
      <div style="display:grid;gap:14px">
        <div class="grid">
          <label for="kDouga">動画 <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kDouga" type="number" min="0" step="0.01"></label>
          <label for="kShiage">仕上 <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kShiage" type="number" min="0" step="0.01"></label>
          <label for="kGentore">清書 <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kGentore" type="number" min="0" step="0.01"></label>
        </div>
        <p class="note" data-i18n="speedNote"></p>
        <div class="grid">
          <label for="start"><span data-i18n="lStart"></span> <span class="unit" data-i18n="uHour"></span><input id="start" type="number" min="0" max="24" step="0.5"></label>
          <label for="end"><span data-i18n="lEnd"></span> <span class="unit" data-i18n="uHour"></span><input id="end" type="number" min="0" max="24" step="0.5"></label>
          <label for="daily"><span data-i18n="lDaily"></span> <span class="unit">hr</span><input id="daily" type="number" min="0" max="24" step="0.5"></label>
          <label for="buffer"><span data-i18n="lBuffer"></span> <span class="unit">%</span><input id="buffer" type="number" min="0" step="1"></label>
          <label for="overhead"><span data-i18n="lOverhead"></span> <span class="unit">hr</span><input id="overhead" type="number" min="0" step="0.25"></label>
          <label for="target"><span data-i18n="lTarget"></span> <span class="unit" data-i18n="uSlackPct"></span><input id="target" type="number" min="0" step="1"></label>
        </div>
        <div class="grid">
          <label for="cEasy"><span data-i18n="lCEasy"></span><input id="cEasy" type="number" min="0" step="0.05"></label>
          <label for="cNormal"><span data-i18n="lCNormal"></span><input id="cNormal" type="number" min="0" step="0.05"></label>
          <label for="cHard"><span data-i18n="lCHard"></span><input id="cHard" type="number" min="0" step="0.05"></label>
          <label for="cExtreme"><span data-i18n="lCExtreme"></span><input id="cExtreme" type="number" min="0" step="0.05"></label>
          <label for="cGaichu"><span data-i18n="lCGaichu"></span><input id="cGaichu" type="number" min="0" step="0.05"></label>
        </div>
        <div class="row"><button type="button" id="reset" data-i18n="reset"></button><span class="note" id="savedNote"></span></div>
      </div>
    </details>
  </section>
  <p class="note" data-i18n="footNote"></p>
</div>

<script>

    alertGaichu:(h,over,need)=>`社外：今日から毎日 ${h}h 作業。最後の 3 日に回さないでください。5 日経って進捗が 3 分の 1 未満なら警告です。${over?`（実際には毎日 ${need}h 必要で、3h を超えています）`:""}`,
    rows:{douga:"動画",shiage:"仕上",gentore:"清書",overhead:"案件ごとの固定",cpx:"排程係数",buffer:"バッファ",total:"新案件 合計",avail:"稼働可能時間",load:"手持ち残り（難カード ×2 後）",slack:"余裕"},
    workdays:w=>`（${w} 稼働日）`, sheets:"枚"
  },
  en: {
    title:"Can I Take It? Calculator", langLabel:"Language",
    sub:"Enter the new job's sheet counts and deadline to check whether it fits in the working hours before the deadline (estimate × schedule coefficient, 8h/day, holidays excluded first). Settings are saved only in this browser.",
    nNeedL:"Hours the new job needs (estimate × coefficient)", nAvailL:"Hours available before the deadline", nSlackL:"Slack after current workload",
    barAria:"Hours allocation", legLoad:"Current workload", legNew:"New job",
    h2new:"New job", uSheet:"sheets", lCpx:"Difficulty",
    chkGaichu:"External client 社外 (use 社外 coefficient)", chkRedo:"Redo / poor source material (extra ×1.3)", chkRisk:"Already holding a high-risk card",
    lDeadline:"Deadline", lLoad:"Remaining workload (normal)", lLoadHard:"Remaining workload (hard cards, auto ×2)",
    h2days:"Days until the deadline", daysHint:"Click a day to toggle work / off. Weekends and Japanese holidays are off by default",
    h2break:"Breakdown", sumSettings:"Settings (speed, work hours)",
    speedWord:"speed", uHrPer:"hr/sheet", speedNote:"Use the 30-day median hr/sheet from Notion 作画_案件.",
    lStart:"Start", lEnd:"End", uHour:"h", lDaily:"Daily cap", lBuffer:"Extra buffer", lOverhead:"Fixed per job",
    lTarget:"Comfort line", uSlackPct:"slack %",
    lCEasy:"簡単 coefficient", lCNormal:"普通 coefficient", lCHard:"難しい coefficient", lCExtreme:"ハード coefficient", lCGaichu:"社外 coefficient",
    reset:"Reset to defaults", saved:"Saved", saveFail:"This browser can't save settings",
    footNote:"Schedule coefficients come from a 13-month review of burnout episodes (2026-10-17): 簡単 0.8 / 普通 1.4 / 難しい 2.0 / ハード 2.8. 社外 cards always use the 社外 coefficient 2.0 (same as 難しい) and do not stack with difficulty; redo or poor source material adds ×1.3. The coefficients already absorb underestimation, so extra buffer defaults to 0. These defaults are one person's measured values; if you use this yourself, replace them in Settings with your own median of actual ÷ expected hours. High risk = 難しい/ハード with 9+ sheets, or 社外; at most one at a time. The full rules are in the Notion project note on the burnout rules and job-acceptance algorithm.",
    weekdays:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    calFill:"The calendar appears once you enter a deadline.", tagDl:"Due", tagOff:"Off", tagHol:"Hol",
    dateLabel:(m,d)=>`${m}/${d}`, work:"work", off:"off",
    calNote:(n,off)=>`${n} days in total, ${off} off. Weekends and Japanese holidays are off by default; click a day to switch it back to work.`,
    whyNoDl:"Enter a deadline", whyPast:"The deadline is before now", whyNoQty:"Enter the sheet counts",
    whyBad:(h,d)=>`Short by ${h}h, about ${d} days of work`,
    whyWarn:(h,t)=>`Slack ${h}h, below the comfort line (${t}% of the new job)`,
    whyOk:(h,w)=>`Slack ${h}h, within ${w} working days`,
    sayHead:"Reply to your lead: ", sayOr:" or ", sayDate:(m,d)=>`「${m}月${d}日なら行けます」`,
    alertTwo:"Only one high-risk card at a time. You already hold one, so don't take this one yet.",
    alertRisk:"This is a high-risk card: if clean-up speed drops below 0.7× the monthly median, tell your lead the same day.",
    alertGaichu:(h,over,need)=>`社外: work ${h}h every day from today and don't leave it for the last 3 days; warn yourself if less than a third is done after 5 days.${over?` (You actually need ${need}h a day, over 3h.)`:""}`,
    rows:{douga:"動画",shiage:"仕上",gentore:"清書",overhead:"Fixed per job",cpx:"Schedule coefficient",buffer:"Buffer",total:"New job total",avail:"Available hours",load:"Current workload (hard cards ×2)",slack:"Slack"},
    workdays:w=>` (${w} working days)`, sheets:"sheets"
  }
};
const LANG_KEY = "toreru-lang";
function detectLang(){
  let pick = "auto";
  try{ pick = localStorage.getItem(LANG_KEY) || "auto"; }catch(e){}
  if(pick !== "auto" && I18N[pick]) return pick;
  for(const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])){
    const c = String(l).toLowerCase();
    if(c.startsWith("ja")) return "ja";
    if(c.startsWith("zh")) return "zh";
    if(c.startsWith("en")) return "en";
  }
  return "en";
}
let lang = detectLang();
const t = key => I18N[lang][key];
function applyLang(){
  document.documentElement.lang = {zh:"zh-Hant", ja:"ja", en:"en"}[lang];
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
}
const DEFAULTS = {
  kDouga:0.55, kShiage:0.10, kGentore:0.59, start:10.5, end:20, daily:8, buffer:0, overhead:0.5, target:20,
  cEasy:0.8, cNormal:1.4, cHard:2.0, cExtreme:2.8, cGaichu:2.0
};
const SETTING_IDS = Object.keys(DEFAULTS);
// v2: coefficients and daily cap changed on 2026-10-17, so old saved settings are not reused
const KEY = "toreru-settings-v2", OFF_KEY = "toreru-offdays-v2";
const REDO_MULT = 1.3, RISK_MAIDS = 9;
const $ = id => document.getElementById(id);
// Overrides of the default (weekends and JP holidays off): date -> true (off) / false (working)
let dayOverride = {};

function loadSettings(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return {...DEFAULTS, ...s}; }catch(e){}
  return {...DEFAULTS};
}
function saveSettings(s){
  try{ localStorage.setItem(KEY, JSON.stringify(s)); $("savedNote").textContent = t("saved"); }
  catch(e){ $("savedNote").textContent = t("saveFail"); }
}
function loadOff(){ try{ return JSON.parse(localStorage.getItem(OFF_KEY)) || {}; }catch(e){ return {}; } }
function saveOff(){
  // keep only today and later
  const today = ymd(new Date());
  const keep = Object.fromEntries(Object.entries(dayOverride).filter(([d]) => d >= today));
  try{ localStorage.setItem(OFF_KEY, JSON.stringify(keep)); }catch(e){}
}
function isOff(d){
  const k = ymd(d);
  if(k in dayOverride) return dayOverride[k];
  return d.getDay() === 0 || d.getDay() === 6 || JP_HOLIDAYS.has(k);
}
function readSettings(){
  const s = {};
  SETTING_IDS.forEach(id => { s[id] = parseFloat($(id).value) || 0; });
  return s;
}
function writeSettings(s){ SETTING_IDS.forEach(id => { $(id).value = s[id]; }); }

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hrs = d => d.getHours() + d.getMinutes()/60;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

// Days from today through the deadline day.
function daysUntil(now, deadline){
  const out = [], day = startOfDay(now), last = startOfDay(deadline);
  while(day <= last && out.length < 120){ out.push(new Date(day)); day.setDate(day.getDate() + 1); }
  return out;
}

// Working hours from `now` until `deadline`, skipping the days the user marked off.
function availableHours(now, deadline, s){
  let total = 0, workdays = 0;
  for(const day of daysUntil(now, deadline)){
    if(isOff(day)) continue;
    let from = s.start, to = s.end;
    if(ymd(day) === ymd(now)) from = Math.max(from, hrs(now));
    if(ymd(day) === ymd(deadline)) to = Math.min(to, hrs(deadline));
    const h = Math.min(Math.max(0, to - from), s.daily);
    if(h > 0){ total += h; workdays++; }
  }
  return {total, workdays};
}

function renderCal(){
  const dl = $("deadline").value ? new Date($("deadline").value) : null;
  const now = new Date();
  if(!dl || dl <= now){ $("cal").innerHTML = ""; $("calNote").textContent = t("calFill"); return; }
  const days = daysUntil(now, dl);
  let html = t("weekdays").map(n => `<span class="wd">${n}</span>`).join("");
  html += '<span class="pad"></span>'.repeat(days[0].getDay());
  for(const d of days){
    const k = ymd(d), off = isOff(d);
    const tag = k === ymd(dl) ? t("tagDl") : off ? t("tagOff") : JP_HOLIDAYS.has(k) ? t("tagHol") : "";
    html += `<button type="button" data-d="${k}" class="${off ? "off" : ""}${k === ymd(dl) ? " dl" : ""}" aria-pressed="${off}" aria-label="${t("dateLabel")(d.getMonth()+1, d.getDate())} ${off ? t("off") : t("work")}">${d.getMonth()+1}/${d.getDate()}<small>${tag || "&nbsp;"}</small></button>`;
  }
  $("cal").innerHTML = html;
  const n = days.filter(isOff).length;
  $("calNote").textContent = t("calNote")(days.length, n);
}

const fmt = n => (Math.round(n*10)/10).toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt2 = n => (Math.round(n*100)/100).toString();

// First day (up to 30 days after the deadline) whose end-of-day leaves room for the job.
function earliestDate(now, deadline, s, load, need){
  const d = startOfDay(deadline);
  for(let i = 0; i < 30; i++){
    d.setDate(d.getDate() + 1);
    if(isOff(d)) continue;
    const end = new Date(d); end.setHours(Math.floor(s.end), (s.end % 1) * 60);
    if(availableHours(now, end, s).total - load - need >= 0) return new Date(d);
  }
  return null;
}

function render(){
  const s = readSettings();
  const q = {douga:+$("qDouga").value||0, shiage:+$("qShiage").value||0, gentore:+$("qGentore").value||0};
  const level = $("cpx").value, gaichu = $("gaichu").checked, redo = $("redo").checked;
  // 社外 replaces the difficulty coefficient instead of stacking on it
  let cpx = gaichu ? s.cGaichu : {easy:s.cEasy, normal:s.cNormal, hard:s.cHard, extreme:s.cExtreme}[level];
  if(redo) cpx *= REDO_MULT;
  const loadHard = +$("loadHard").value || 0;
  const load = (+$("load").value || 0) + loadHard * 2;
  const base = {douga:q.douga*s.kDouga, shiage:q.shiage*s.kShiage, gentore:q.gentore*s.kGentore};
  const raw = (base.douga + base.shiage + base.gentore + s.overhead) * cpx;
  const need = raw * (1 + s.buffer/100);
  const now = new Date();
  const dl = $("deadline").value ? new Date($("deadline").value) : null;
  const av = dl ? availableHours(now, dl, s) : {total:0, workdays:0};
  const slack = av.total - load - need;

  $("nNeed").textContent = fmt(need) + "h";
  $("nAvail").textContent = fmt(av.total) + "h";
  $("nSlack").textContent = (slack >= 0 ? "+" : "") + fmt(slack) + "h";

  let state, stamp, why;
  if(!dl){ state="var(--muted)"; stamp="—"; why=t("whyNoDl"); }
  else if(dl <= now){ state="var(--bad)"; stamp="締め切り過ぎ"; why=t("whyPast"); }
  else if(!q.douga && !q.shiage && !q.gentore){ state="var(--muted)"; stamp="—"; why=t("whyNoQty"); }
  else if(slack < 0){ state="var(--bad)"; stamp="取れない"; why=t("whyBad")(fmt(-slack), fmt(-slack/(s.daily||1))); }
  else if(slack < need * s.target/100){ state="var(--warn)"; stamp="ギリギリ"; why=t("whyWarn")(fmt(slack), s.target); }
  else { state="var(--ok)"; stamp="取れる"; why=t("whyOk")(fmt(slack), av.workdays); }
  $("verdict").style.setProperty("--state", state);
  $("stamp").textContent = stamp; $("why").textContent = why;

  // What to tell 主任 when it does not fit
  let say = "";
  if(dl && dl > now && slack < 0){
    const parts = ["「その締切だと厳しいです」"];
    const ok = earliestDate(now, dl, s, load, need);
    if(ok) parts.push(t("sayDate")(ok.getMonth()+1, ok.getDate()));
    const dougaOnly = (q.douga*s.kDouga + s.overhead) * cpx * (1 + s.buffer/100);
    if(q.shiage && q.douga && av.total - load - dougaOnly >= 0) parts.push("「動画だけなら」");
    say = t("sayHead") + parts.join(t("sayOr"));
  }
  $("say").textContent = say;

  const highRisk = gaichu || ((level === "hard" || level === "extreme") && q.douga >= RISK_MAIDS);
  const alerts = [];
  if(highRisk && $("hasRisk").checked) alerts.push(["bad", t("alertTwo")]);
  else if(highRisk) alerts.push(["", t("alertRisk")]);
  if(gaichu && dl && dl > now){
    const perDay = need / Math.max(av.workdays, 1);
    alerts.push([perDay > 3 ? "bad" : "", t("alertGaichu")(fmt(Math.max(2, Math.min(3, perDay))), perDay > 3, fmt(perDay))]);
  }
  $("alerts").innerHTML = alerts.map(([c,t]) => `<li class="${c}">${t}</li>`).join("");

  const scale = Math.max(av.total, load + need, 1);
  $("bLoad").style.width = (Math.min(load, scale)/scale*100) + "%";
  $("bNeed").style.width = (Math.min(need, Math.max(0, scale-load))/scale*100) + "%";

  const R = t("rows");
  const rows = [
    [`${R.douga} ${q.douga}${t("sheets")} × ${s.kDouga}`, base.douga],
    [`${R.shiage} ${q.shiage}${t("sheets")} × ${s.kShiage}`, base.shiage],
    [`${R.gentore} ${q.gentore}${t("sheets")} × ${s.kGentore}`, base.gentore],
    [R.overhead, s.overhead],
    [`${R.cpx} × ${fmt2(cpx)}`, (base.douga+base.shiage+base.gentore+s.overhead)*(cpx-1)],
    [`${R.buffer} ${s.buffer}%`, need - raw],
    [R.total, need],
    [`${R.avail}${t("workdays")(av.workdays)}`, av.total],
    [R.load, -load],
    [R.slack, slack]
  ];
  $("breakdown").innerHTML = rows.map(([k,v]) => `<tr><td>${k}</td><td>${fmt(v)}h</td></tr>`).join("");
}

function init(){
  applyLang();
  let saved = "auto"; try{ saved = localStorage.getItem(LANG_KEY) || "auto"; }catch(e){}
  $("lang").value = I18N[saved] ? saved : "auto";
  $("lang").addEventListener("change", () => {
    try{ localStorage.setItem(LANG_KEY, $("lang").value); }catch(e){}
    lang = detectLang(); applyLang(); renderCal(); render();
  });
  writeSettings(loadSettings());
  dayOverride = loadOff();
  // example job so the first view shows a real verdict
  $("qDouga").value = 18; $("qShiage").value = 24; $("qGentore").value = 6; $("cpx").value = "normal"; $("load").value = 0; $("loadHard").value = 0;
  const dl = new Date(); dl.setDate(dl.getDate() + 7);
  $("deadline").value = `${ymd(dl)}T16:00`;
  document.querySelectorAll("#settingsBox input").forEach(el => el.addEventListener("input", () => { saveSettings(readSettings()); render(); }));
  ["qDouga","qShiage","qGentore","cpx","load","loadHard","gaichu","redo","hasRisk"].forEach(id => $(id).addEventListener("input", render));
  $("deadline").addEventListener("input", () => { renderCal(); render(); });
  $("cal").addEventListener("click", e => {
    const b = e.target.closest("button[data-d]"); if(!b) return;
    const k = b.dataset.d;
    dayOverride[k] = !isOff(new Date(k + "T00:00"));
    saveOff(); renderCal(); render();
  });
  $("reset").addEventListener("click", () => { writeSettings({...DEFAULTS}); saveSettings(readSettings()); render(); });
  renderCal(); render();
}
init();
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="title">小畫家畫得完嗎！？計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a cut bag sheet; red-pencil accent for the verdict, blue-pencil for secondary marks */
:root{
  --bg:#f6f7f4; --paper:#ffffff; --ink:#1f2a33; --muted:#5e6b75; --rule:#d9dfe3;
  --red:#c63a2f; --blue:#2f5f9e; --ok:#2e7d4f; --warn:#b7791f; --bad:#c63a2f;
  --field:#f9faf8;
  --f-body:"Noto Sans TC","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a1f; --paper:#1d242b; --ink:#e6eaed; --muted:#9aa7b1; --rule:#33404a;
  --red:#ef6b5f; --blue:#7ea6e0; --ok:#5fc08a; --warn:#e2a948; --bad:#ef6b5f; --field:#232c34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a1f; --paper:#1d242b; --ink:#e6eaed; --muted:#9aa7b1; --rule:#33404a;
  --red:#ef6b5f; --blue:#7ea6e0; --ok:#5fc08a; --warn:#e2a948; --bad:#ef6b5f; --field:#232c34; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
/* 新案 and the day picker sit side by side when there is room */
.pair{display:grid;gap:16px;align-content:start}
@media (min-width:900px){.wrap{max-width:1080px}.pair{grid-template-columns:1fr 1fr}}
.fold{display:grid}
.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--blue);font-size:inherit;font-weight:inherit}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s ease}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold[open]>summary{margin-bottom:14px}
.fold>summary .note{margin-left:auto;font-weight:400}
.fold-body{display:grid;gap:14px}
.quick td,.quick th{padding:4px 6px;border-bottom:1px dashed var(--rule);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.quick th{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.78rem}
.quick td:first-child,.quick th:first-child{text-align:left;padding-left:0}
.quick td:first-child small{color:var(--muted);font-family:var(--f-body)}
.quick tr.bad td{color:var(--bad)}
.quick tr.warn td{color:var(--warn)}
.dists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.dist{position:relative;display:grid;gap:2px;align-content:start}
.dist h3{margin:0;font-size:.85rem;font-weight:600;color:var(--muted)}
.dist-wait[hidden],.dist [hidden]{display:none}
.dist-wait{display:grid;place-items:center;height:120px;border:1px dashed var(--rule);border-radius:6px;padding:8px;text-align:center}
.dist svg{width:100%;height:120px;display:block;touch-action:none}
.dist-axis{position:relative;height:18px;font:12px var(--f-num);color:var(--muted)}
.dist-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dist-top{position:relative;height:16px;font:12px var(--f-num);color:var(--red)}
.dist-top span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dist-band{position:relative;height:22px;font:12px var(--f-num);color:var(--blue)}
.dist-band div{position:absolute;top:2px;border-top:2px solid var(--blue);display:flex;justify-content:space-between;gap:6px;white-space:nowrap;padding-top:2px}
.dist-band b{font-weight:600}
.dist-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;font:12px var(--f-num);color:var(--ink);pointer-events:none;white-space:nowrap}
.quick tr.skip td{color:var(--muted)} .quick label.pick{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font:inherit;color:inherit} .quick label.pick input{width:auto;margin:0}
.quick tr.new td{font-weight:600} #notionNote.stale{color:var(--warn)}
h1{font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px;display:grid;gap:14px}
.sheet h2{font-size:.78rem;letter-spacing:.12em;color:var(--blue);margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* 新案: 工種・精細度・動作 on one row, 清書・合わせ・仕上 on the next */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cgrid input{padding:5px 6px;text-align:right}
.cgrid input.est{border-style:dashed;color:var(--muted)}
.cgrid th{font-weight:500;color:var(--muted);font-size:.78rem;padding:4px 6px;text-align:center}
.cgrid th[scope=row]{text-align:left;padding-left:0}
.cgrid td{padding:3px;border:0;text-align:center}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label[hidden]{display:none}
input,select{font:inherit;font-family:var(--f-num);font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.unit{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.verdict{display:grid;gap:12px;border-left:4px solid var(--state,var(--muted))}
.verdict .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.stamp{font-size:1.6rem;font-weight:700;color:var(--state,var(--ink));letter-spacing:.04em}
.why{color:var(--muted);font-size:.9rem;min-width:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.num{display:grid;gap:2px}
.num b{font-family:var(--f-num);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.num span{font-size:.78rem;color:var(--muted)}
.bar{height:10px;background:var(--field);border:1px solid var(--rule);border-radius:3px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td{padding:4px 0;border-bottom:1px dashed var(--rule)}
td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:.85rem;color:var(--blue);font-weight:500}
details[open] summary{margin-bottom:12px}
.note{font-size:.78rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:.85rem;background:transparent;color:var(--blue);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center}
.cal button{display:grid;gap:0;justify-items:center;padding:6px 2px;color:var(--ink);background:var(--field);font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.2;min-width:0}
.cal button small{font-family:var(--f-body);font-size:.68rem;color:var(--muted)}
.cal button.off{background:transparent;color:var(--muted);text-decoration:line-through;border-style:dashed}
.cal button.off small{color:var(--red);text-decoration:none}
.cal button.dl{border-color:var(--red)}
.cal .pad{visibility:hidden}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chk input{width:auto}
.alerts{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:.85rem}
.alerts li{color:var(--warn)}
.alerts li.bad{color:var(--bad)}
.say{font-size:.9rem;margin:0}
.say b{font-weight:700}
.langsel{display:block;width:auto;flex:none}
.langsel select{width:auto;font-family:var(--f-body);font-size:.85rem;padding:5px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <h1 data-i18n="title">小畫家畫得完嗎！？計算機</h1>
      <label for="lang" class="langsel"><span class="sr" data-i18n="langLabel">語言</span>
        <select id="lang"><option value="auto">Auto</option><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select>
      </label>
    </div>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <section class="sheet verdict" id="verdict" aria-live="polite">
    <div class="head"><span class="stamp" id="stamp">—</span><span class="why" id="why"></span></div>
    <div class="nums">
      <div class="num"><b id="nNeed">0</b><span data-i18n="nNeedL"></span><span id="nNeedMid"></span></div>
      <div class="num"><b id="nAvail">0</b><span data-i18n="nAvailL"></span></div>
      <div class="num"><b id="nSlack">0</b><span data-i18n="nSlackL"></span></div>
    </div>
    <p class="note" id="rangeNote"></p>
    <div id="distBox" hidden>
      <div class="dists">
        <div class="dist"><h3 data-i18n="distNowT"></h3>
          <div class="dist-top" id="distNowTop"></div>
          <svg id="distNow" viewBox="0 0 320 120" role="img" preserveAspectRatio="none"></svg>
          <div class="dist-band" id="distNowBand"></div>
          <div class="dist-axis" id="distNowAxis"></div>
          <div class="dist-tip" id="distNowTip" hidden></div>
          <p class="note" id="distNowNote"></p>
        </div>
        <div class="dist"><h3 data-i18n="distNewT"></h3>
          <p class="note dist-wait" id="distNewWait" data-i18n="distWait"></p>
          <div class="dist-top" id="distNewTop"></div>
          <svg id="distNew" viewBox="0 0 320 120" role="img" preserveAspectRatio="none"></svg>
          <div class="dist-band" id="distNewBand"></div>
          <div class="dist-axis" id="distNewAxis"></div>
          <div class="dist-tip" id="distNewTip" hidden></div>
          <p class="note" id="distNewNote"></p>
        </div>
      </div>
      <p class="note" id="distNote"></p>
    </div>
    <div class="bar" role="img" id="bar" data-i18n-aria="barAria"><i id="bLoad" style="background:var(--blue)"></i><i id="bNeed" style="background:var(--red)"></i></div>
    <div class="legend"><span><em style="background:var(--blue)"></em><span data-i18n="legLoad"></span></span><span><em style="background:var(--red)"></em><span data-i18n="legNew"></span></span><span><em style="background:var(--field);border:1px solid var(--rule)"></em><span>空き</span></span></div>
    <p class="say" id="say"></p>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <section class="sheet" id="cardsSheet" hidden>
    <details class="fold" data-fold="cards" open>
      <summary><h2 data-i18n="h2cards"></h2></summary>
      <div class="fold-body">
        <table class="quick"><thead><tr><th data-i18n="chCard"></th><th data-i18n="qhDue"></th><th data-i18n="chRem"></th><th data-i18n="chSlack"></th><th data-i18n="chLate"></th></tr></thead><tbody id="cards"></tbody></table>
        <p class="say" id="simOut"></p>
        <p class="note" id="cardsNote"></p>
      </div>
    </details>
  </section>

  <section class="sheet">
    <details class="fold" data-fold="quick" open>
      <summary><h2 data-i18n="h2quick"></h2></summary>
      <div class="fold-body">
        <table class="quick"><thead><tr><th data-i18n="qhDue"></th><th data-i18n="qhFree"></th><th id="qhSheet"></th></tr></thead><tbody id="quick"></tbody></table>
        <p class="note" id="quickNote"></p>
      </div>
    </details>
  </section>

  <div class="pair">
  <section class="sheet">
    <details class="fold" data-fold="new" open>
      <summary><h2 data-i18n="h2new"></h2></summary>
      <div class="fold-body">
    <div class="grid3">
      <label for="jobType"><span data-i18n="lJobType"></span>
        <select id="jobType"><option value="doushi">動仕</option><option value="lo">LO（一原）</option><option value="nigen">二原</option></select>
      </label>
      <label for="cpxD"><span data-i18n="lDetail"></span>
        <select id="cpxD"><option value="easy">簡単</option><option value="normal">普通</option><option value="hard">難しい</option><option value="extreme">ハード</option></select>
      </label>
      <label for="cpxA"><span data-i18n="lMotion"></span>
        <select id="cpxA"><option value="easy">簡単</option><option value="normal">普通</option><option value="hard">難しい</option><option value="extreme">ハード</option></select>
      </label>
    </div>
    <div class="grid3">
      <label for="qGentore" data-job="doushi">清書 <span class="unit" data-i18n="uSheet"></span><input id="qGentore" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="qDouga" data-job="doushi">合わせ <span class="unit" data-i18n="uSheet"></span><input id="qDouga" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="qShiage" data-job="doushi">仕上 <span class="unit" data-i18n="uSheet"></span><input id="qShiage" type="number" min="0" step="1" inputmode="numeric"></label>
      <label for="qGen" data-job="genga"><span data-i18n="lGen"></span> <span class="unit" data-i18n="uSheet"></span><input id="qGen" type="number" min="0" step="1" inputmode="numeric"></label>
    </div>
    <div class="row">
      <label class="chk" for="gaichu"><input id="gaichu" type="checkbox"><span data-i18n="chkGaichu"></span></label>
      <label class="chk" for="part" data-job="doushi"><input id="part" type="checkbox"><span data-i18n="chkPart"></span></label>
      <label class="chk" for="redo"><input id="redo" type="checkbox"><span data-i18n="chkRedo"></span></label>
      <label class="chk" for="hasRisk"><input id="hasRisk" type="checkbox"><span data-i18n="chkRisk"></span></label>
    </div>
    <div class="grid">
      <label for="deadline"><span data-i18n="lDeadline"></span><input id="deadline" type="datetime-local"></label>
      <label for="load"><span data-i18n="lLoad"></span> <span class="unit">hr</span><input id="load" type="number" min="0" step="0.5"></label>
      <label for="loadHard"><span data-i18n="lLoadHard"></span> <span class="unit">hr</span><input id="loadHard" type="number" min="0" step="0.5"></label>
    </div>
    <div class="row"><span class="note" id="notionNote"></span><button type="button" id="notionClear" data-i18n="notionClear" hidden></button></div>
      </div>
    </details>
  </section>

  <section class="sheet">
    <details class="fold" data-fold="days" open>
      <summary><h2 data-i18n="h2days"></h2></summary>
      <div class="fold-body">
    <p class="note" data-i18n="daysHint"></p>
    <div class="cal" id="cal"></div>
    <p class="note" id="calNote"></p>
    <div class="row">
      <label for="country"><span data-i18n="lCountry"></span><select id="country"></select></label>
      <span class="note" id="holNote"></span>
    </div>
    <div class="row">
      <select id="csvYear" data-i18n-aria="csvYearAria"></select>
      <button type="button" id="csvBtn" data-i18n="csvBtn"></button>
    </div>
    <p class="note" data-i18n="csvNote"></p>
      </div>
    </details>
  </section>
  </div>

  <section class="sheet">
    <details class="fold" data-fold="reest" open>
      <summary><h2 data-i18n="h2re"></h2></summary>
      <div class="fold-body">
        <p class="note" data-i18n="reHint"></p>
        <div class="grid3">
          <label for="reGenH"><span data-i18n="lReGen"></span> <span class="unit">hr</span><input id="reGenH" type="number" min="0" step="0.25"></label>
        </div>
        <p class="say" id="reOut"></p>
      </div>
    </details>
  </section>

  <section class="sheet">
    <details class="fold" data-fold="break" open>
      <summary><h2 data-i18n="h2break"></h2></summary>
      <table><tbody id="breakdown"></tbody></table>
    </details>
  </section>

  <section class="sheet">
    <details id="settingsBox">
      <summary data-i18n="sumSettings"></summary>
      <div style="display:grid;gap:14px">
        <div class="grid">
          <label for="kGentore">清書 <span data-i18n="speedWord"></span><span data-i18n="speedNormal"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kGentore" type="number" min="0" step="0.01"></label>
          <label for="kDouga">合わせ <span data-i18n="speedWord"></span><span data-i18n="speedNormal"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kDouga" type="number" min="0" step="0.01"></label>
          <label for="kShiage">仕上 <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kShiage" type="number" min="0" step="0.01"></label>
          <label for="kLoMai">LO（一原） <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kLoMai" type="number" min="0" step="0.01"></label>
          <label for="kNigenMai">二原 <span data-i18n="speedWord"></span> <span class="unit" data-i18n="uHrPer"></span><input id="kNigenMai" type="number" min="0" step="0.01"></label>
        </div>
        <p class="note" data-i18n="speedNote"></p>
        <label for="linkPaste"><span data-i18n="lLinkPaste"></span><input id="linkPaste" type="url" inputmode="url" autocomplete="off"></label>
        <div class="grid">
          <label for="start"><span data-i18n="lStart"></span> <span class="unit" data-i18n="uHour"></span><input id="start" type="number" min="0" max="24" step="0.5"></label>
          <label for="end"><span data-i18n="lEnd"></span> <span class="unit" data-i18n="uHour"></span><input id="end" type="number" min="0" max="24" step="0.5"></label>
          <label for="daily"><span data-i18n="lDaily"></span> <span class="unit">hr</span><input id="daily" type="number" min="0" max="24" step="0.5"></label>
          <label for="buffer"><span data-i18n="lBuffer"></span> <span class="unit">%</span><input id="buffer" type="number" min="0" step="1"></label>
          <label for="overhead"><span data-i18n="lOverhead"></span> <span class="unit">hr</span><input id="overhead" type="number" min="0" step="0.25"></label>
          <label for="dlDays"><span data-i18n="lDlDays"></span> <span class="unit" data-i18n="uWorkdays"></span><input id="dlDays" type="number" min="0" max="60" step="1"></label>
          <label for="dlHour"><span data-i18n="lDlHour"></span> <span class="unit" data-i18n="uHour"></span><input id="dlHour" type="number" min="0" max="23.5" step="0.5"></label>
        </div>
        <div>
          <p class="note" data-i18n="gridTitle" style="margin-bottom:6px"></p>
          <table class="cgrid" id="cgrid"></table>
          <p class="note" data-i18n="gridNote" style="margin-top:6px"></p>
          <p class="note" id="modelNote"></p>
        </div>
        <div class="grid">
          <label for="riskLevel"><span data-i18n="lRiskLevel"></span><select id="riskLevel"><option value="1">普通</option><option value="2">難しい</option><option value="3">ハード</option><option value="9" data-i18n="optNever"></option></select></label>
          <label for="riskMai"><span data-i18n="lRiskMai"></span> <span class="unit" data-i18n="uSheet"></span><input id="riskMai" type="number" min="0" step="1"></label>
          <label for="riskGaichu"><span data-i18n="lRiskGaichu"></span><select id="riskGaichu"><option value="1" data-i18n="optYes"></option><option value="0" data-i18n="optNo"></option></select></label>
        </div>
        <p class="note" data-i18n="riskNote"></p>
        <div class="row"><button type="button" id="reset" data-i18n="reset"></button><span class="note" id="savedNote"></span></div>
      </div>
    </details>
  </section>
  <p class="note" data-i18n="footNote"></p>
</div>

<script>
// Built-in national holidays 2026–2028 (from the python-holidays package), used when the API has no data for a country/year
const BUILTIN_HOLIDAYS = {

function detectLang(){
  let pick = "auto";

  if(pick !== "auto" && I18N[pick]) return pick;
  for(const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])){
    const c = String(l).toLowerCase();
    if(c.startsWith("ja")) return "ja";
    if(c.startsWith("zh")) return "zh";
    if(c.startsWith("en")) return "en";
  }
  return "en";
}

async function fetchYear(cc, y){
  const key = `toreru-hol-${cc}-${y}`;
  try{ const c = JSON.parse(localStorage.getItem(key)); if(Array.isArray(c) && c.length) return {list:c, src:"api"}; }catch(e){}
  let list = [];

    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/${cc}`);
    // regional holidays (global: false) only apply to part of the country
    if(r.ok) list = (await r.json()).filter(h => h.global !== false).map(h => h.date);
  }catch(e){}
  if(list.length){
    try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){}
    return {list, src:"api"};
  }
  // Nager.Date answers some countries (e.g. Taiwan) with an empty 204, and fails offline: use the built-in table
  const b = builtinYear(cc, y);

async function loadHolidays(){
  const cc = country, y = new Date().getFullYear();
  if(cc === "none"){ holidays = new Set(); holState = ""; }
  else{
    holState = "loading"; renderHolNote();
    try{
      const lists = await Promise.all([y, y + 1].map(yr => fetchYear(cc, yr)));
      if(cc !== country) return;
      holidays = new Set(lists.flatMap(l => l.list));
      holState = lists.some(l => l.src === "builtin") ? "builtin" : "ok";
    }catch(e){
      if(cc !== country) return;
      holidays = new Set(); holState = "fail";
    }
  }
  setDefaultDeadline(); renderHolNote(); renderCal(); render();
}

  for(const d = new Date(yr, 0, 1); d.getFullYear() === yr; d.setDate(d.getDate() + 1)){
    const k = ymd(d), weekend = d.getDay() === 0 || d.getDay() === 6;

    rows.push(`${k},${k},${off ? "Yes" : "No"}`);

  const kGen = jobType === "lo" ? s.kLoMai : s.kNigenMai;
  const lvD = $("cpxD").value, lvA = $("cpxA").value, gaichu = $("gaichu").checked, redo = $("redo").checked, part = doushi && $("part").checked;
  // the grid multiplies line work (清書+合わせ, or 原画) only; 仕上 is estimated per 精細度
  let cpx = s[gridId(lvD, lvA)];
  if(gaichu) cpx *= extMult();
  if(redo) cpx *= REDO_MULT;
  if(part) cpx *= partMult();
  const shK = shiagePer(s, LEVELS.indexOf(lvD));
  const job = {label: $("jobType").selectedOptions[0].textContent, perSheet: doushi ? s.kDouga * cpx + shK : kGen * cpx};
  // hours of unticked cards come off the ordinary workload first, then off the hard-card workload (the link does not say which a card is)
  const skipH = skippedHours(), loadN = +$("load").value || 0;
  const loadHard = Math.max(0, (+$("loadHard").value || 0) - Math.max(0, skipH - loadN));
  const load = Math.max(0, loadN - skipH) + loadHard * 2;
  const base = {douga:q.douga*s.kDouga, shiage:q.shiage*shK, gentore:q.gentore*s.kGentore, gen:q.gen*kGen};
  const line = (base.douga + base.gentore + base.gen) * cpx, fixed = base.shiage + s.overhead, bf = 1 + s.buffer/100;
  const raw = line + fixed;
  const need = raw * bf;
  // spread of actual ÷ estimate for cards of this size (line-work part only)
  // 仕上 has its own spread; the two are taken at the same rank for the range (they move together at about 0.5, so slightly wide)
  const sp = spreadFor(doushi ? q.gentore + q.douga : q.gen, part), ssp = shiageSpread();
  const sdv = sdSum(line, sp.sd, base.shiage, ssp.sd), vary = line + base.shiage;
  let rq = sp.q; if(rq.length < 4) rq = [...rq, rq[2]];
  const sq = ssp.q.length < 4 ? [...ssp.q, ssp.q[2]] : ssp.q;
  const [needLo, needBad] = [0, badIdx()].map(k => (line * rq[k] + base.shiage * sq[k] + s.overhead) * bf);
  const now = new Date();
  const dl = $("deadline").value ? new Date($("deadline").value) : null;
  const av = dl ? availableHours(now, dl, s) : {total:0, workdays:0};
  const slack = av.total - load - need, slackBad = av.total - load - needBad;

  // the range comes first: a single number is off by ×1.6 or more for one card in three
  $("nNeed").textContent = need > 0 ? `${fmt(needLo)}～${fmt(needBad)}h` : "0h";
  $("nNeedMid").textContent = need > 0 ? t("nNeedMid")(fmt(need)) : "";
  $("nAvail").textContent = fmt(av.total) + "h";
  $("nSlack").textContent = (slack >= 0 ? "+" : "") + fmt(slack) + "h";
  $("modelNote").textContent = model ? t("modelOn")(model.n, model.at, model.w || 1) + (model.dated ? t("modelTrend")(Math.round((Math.exp(-(model.trend || 0)) - 1) * 100), model.recent || 1) : model.fitted ? t("modelNoAge") : "") : t("modelOff");
  // cards on hand: each Notion card is its own log-normal; hours the cards do not account for (hard-card doubling, typed load) go in as one more
  const sdOld = median((model && model.sd ? model.sd : SD_BY_SIZE).map(e => e[1]));
  const onHand = notion ? notion.cards.filter(c => !isSkipped(c) && c.rem > 0).map(c => ({m: c.rem, s: sdOld})) : [];
  const rest = load - onHand.reduce((t, x) => t + x.m, 0);
  if(rest > 0.01) onHand.push({m: rest, s: sdOld});
  const nowD = {...sumLogn(onHand), b: 0};
  const nextD = hasQtyD(q) ? {...sumLogn([...onHand, {m: vary * bf, s: sdv}]), b: s.overhead * bf} : null;
  renderDist(nowD, nextD, dl && dl > now ? av.total : null);
  $("rangeNote").textContent = need > 0 ? t("rangeNote")(fmt(needLo), fmt(need), fmt(needBad), badPct()) + t("sdNote")(fmt2(sdv), fmt2(Math.exp(sdv))) : "";

  // high risk looks at the harder of 精細度 and 動作
  const levelRank = Math.max(LEVELS.indexOf(lvD), LEVELS.indexOf(lvA));
  const highRisk = (gaichu && s.riskGaichu === 1) || (levelRank >= s.riskLevel && (doushi ? q.douga : q.gen) >= s.riskMai);
  const hasQty = q.douga || q.shiage || q.gentore || q.gen;
  const cards = renderCards(now, s, hasQty ? need : 0, dl, {line: vary, fixed: s.overhead, bf, sd: sdv});
  const unknown = notion ? notion.cards.filter(c => c.rem === null && !isSkipped(c)).length : 0;

  let state, stamp, why;
  if(!dl){ state="var(--muted)"; stamp="—"; why=t("whyNoDl"); }
  else if(dl <= now){ state="var(--bad)"; stamp="締め切り過ぎ"; why=t("whyPast"); }
  else if(!hasQty){ state="var(--muted)"; stamp="—"; why=t("whyNoQty"); }
  else if(slack < 0){ state="var(--bad)"; stamp="取れない"; why=t("whyBad")(fmt(-slack), fmt(-slack/(s.daily||1))); }
  else if(highRisk && $("hasRisk").checked){ state="var(--bad)"; stamp="取れない"; why=t("whyRisk"); }
  else if(cards.late.length){ state="var(--bad)"; stamp="取れない"; why=t("whyLate")(cards.late.length); }
  else if(slackBad < 0){ state="var(--warn)"; stamp="ギリギリ"; why=t("whyWarn")(fmt(needBad), fmt(-slackBad)); }
  else if(unknown){ state="var(--warn)"; stamp="ギリギリ"; why=t("whyUnknown")(unknown); }
  else { state="var(--ok)"; stamp="取れる"; why=t("whyOk")(fmt(slack), av.workdays); }
  $("verdict").style.setProperty("--state", state);
  $("stamp").textContent = stamp; $("why").textContent = why;

  // What to tell 主任 when it does not fit
  let say = "";
  if(dl && dl > now && slack < 0){
    const parts = ["「その締切だと厳しいです」"];
    const ok = earliestDate(now, dl, s, load, need);
    if(ok) parts.push(t("sayDate")(ok.getMonth()+1, ok.getDate()));
    const dougaOnly = ((q.gentore*s.kGentore + q.douga*s.kDouga) * cpx + s.overhead) * bf;
    if(q.shiage && q.douga && av.total - load - dougaOnly >= 0) parts.push("「動画だけなら」");
    say = t("sayHead") + parts.join(t("sayOr"));
  }
  $("say").textContent = say;

  const alerts = [];
  if(highRisk && $("hasRisk").checked) alerts.push(["bad", t("alertTwo")]);
  else if(highRisk) alerts.push(["", t("alertRisk")]);
  if(cards.late.length) alerts.push(["bad", t("alertLate")(cards.late.join(lang === "en" ? ", " : "、"))]);
  if(cards.already.length) alerts.push(["", t("alertAlreadyLate")(cards.already.join(lang === "en" ? ", " : "、"))]);
  if(gaichu) alerts.push(["", t("alertExt")(fmt2(extMult()), model ? model.nExt : 12)]);
  if(part) alerts.push(["", t("alertPart")(fmt2(partMult()), fmt2(Math.exp(sdv)))]);
  if(lvA === "extreme") alerts.push(["", t("alertHardMotion")]);
  if(gaichu && dl && dl > now){
    const perDay = need / Math.max(av.workdays, 1);
    alerts.push([perDay > 3 ? "bad" : "", t("alertGaichu")(fmt(Math.max(2, Math.min(3, perDay))), perDay > 3, fmt(perDay))]);
  }
  $("alerts").innerHTML = alerts.map(([c,t]) => `<li class="${c}">${t}</li>`).join("");

  const scale = Math.max(av.total, load + need, 1);
  $("bLoad").style.width = (Math.min(load, scale)/scale*100) + "%";
  $("bNeed").style.width = (Math.min(need, Math.max(0, scale-load))/scale*100) + "%";

  const R = t("rows");
  const work = doushi ? [
    [`${R.gentore} ${q.gentore}${t("sheets")} × ${s.kGentore}`, base.gentore],
    [`${R.douga} ${q.douga}${t("sheets")} × ${s.kDouga}`, base.douga],
  ] : [[`${job.label} ${q.gen}${t("sheets")} × ${kGen}`, base.gen]];
  const rows = [
    ...work,
    [`${R.cpx} × ${fmt2(cpx)}`, (base.douga+base.gentore+base.gen)*(cpx-1)],
    ...(doushi ? [[`${R.shiage} ${q.shiage}${t("sheets")} × ${fmt2(shK)}`, base.shiage]] : []),
    [R.overhead, s.overhead],
    [`${R.buffer} ${s.buffer}%`, need - raw],
    [R.total, need],
    [R.bad, needBad],
    [`${R.avail}${t("workdays")(av.workdays)}`, av.total],
    [R.load, -load],
    [R.slack, slack]
  ];
  $("breakdown").innerHTML = rows.map(([k,v]) => `<tr><td>${k}</td><td>${fmt(v)}h</td></tr>`).join("");
  renderQuick(now, s, cpx, load, job);

  // After 清書: re-estimate 合わせ from the actual 清書 speed and 動作
  const reH = +$("reGenH").value || 0;
  if(doushi && reH > 0 && q.gentore > 0 && q.douga > 0){
    const hard = LEVELS.indexOf(lvA) >= 2 ? 1 : 0;
    const rm = reModel(), c = rm.coef;
    const per = Math.exp(c[0] + c[1] * Math.log(reH / q.gentore) + c[2] * hard) * (gaichu ? extMult() : 1);
    const rr = pick(rm.range, q.douga), [lo, hi, bad] = [rr[0], rr[1], rr[rr.length > 3 ? badIdx() : 2]].map(f => per * q.douga * f);
    $("reOut").textContent = t("reOut")(fmt2(per), fmt(lo), fmt(hi), fmt(per * q.douga + base.shiage), fmt(bad + base.shiage));
  } else $("reOut").textContent = t("reNeed");
}

// Remember which sections are collapsed
const FOLD_KEY = "toreru-fold";
function initFolds(){
  let st = {};
  try{ st = JSON.parse(localStorage.getItem(FOLD_KEY)) || {}; }catch(e){}
  document.querySelectorAll("details.fold").forEach(el => {
    const k = el.dataset.fold;
    if(k in st) el.open = st[k];
    el.addEventListener("toggle", () => {
      st[k] = el.open;
      try{ localStorage.setItem(FOLD_KEY, JSON.stringify(st)); }catch(e){}
    });
  });
}

// Default deadline skips weekends, holidays and days marked off; it follows holiday changes until the user edits it
let deadlineTouched = false;
function setDefaultDeadline(){
  if(deadlineTouched) return;
  const s = readSettings(), days = Math.round(s.dlDays), h = Math.min(Math.max(s.dlHour, 0), 23.5);
  const d = startOfDay(new Date());
  for(let n = 0, i = 0; n < days && i < 120; i++){
    d.setDate(d.getDate() + 1);
    if(!isOff(d)) n++;
  }
  $("deadline").value = `${ymd(d)}T${String(Math.floor(h)).padStart(2,"0")}:${h % 1 ? "30" : "00"}`;
}

function buildGrid(){
  const head = `<tr><th scope="col">精細度 ＼ 動作</th>` + LEVELS.map(a => `<th scope="col">${$("cpxA").querySelector(`[value=${a}]`).textContent}</th>`).join("") + "</tr>";
  const body = LEVELS.map(d => `<tr><th scope="row">${$("cpxD").querySelector(`[value=${d}]`).textContent}</th>` +
    LEVELS.map(a => `<td><input id="${gridId(d, a)}" type="number" min="0" step="0.05" aria-label="${d} × ${a}"${gridEst().includes(gridId(d, a)) ? ' class="est"' : ""}></td>`).join("") + "</tr>").join("");
  $("cgrid").innerHTML = head + body;
}
function init(){
  applyLang();
  buildGrid();
  initFolds();
  let saved = "auto"; try{ saved = localStorage.getItem(LANG_KEY) || "auto"; }catch(e){}
  $("lang").value = I18N[saved] ? saved : "auto";
  $("lang").addEventListener("change", () => {
    try{ localStorage.setItem(LANG_KEY, $("lang").value); }catch(e){}
    lang = detectLang(); applyLang(); renderNotionNote(); renderCountries(); renderHolNote(); renderCal(); render();
  });
  { const s0 = applyLinkSpeeds(loadSettings()); buildGrid(); writeSettings(s0); }
  dayOverride = loadOff();
  // start empty, or with the workload from the Notion snapshot; deadline defaults to 12:00 on the third working day from today
  $("cpxD").value = "normal"; $("cpxA").value = "normal"; $("load").value = 0; $("loadHard").value = 0;
  applyNotion(); renderNotionNote();
  ["distNow", "distNew"].forEach(id => {
    ["pointermove", "pointerdown"].forEach(ev => $(id).addEventListener(ev, distHover));
    $(id).addEventListener("pointerleave", distLeave);
  });
  $("cards").addEventListener("change", e => {
    const k = e.target.dataset && e.target.dataset.card;
    if(!k) return;
    if(e.target.checked) skipped.delete(k); else skipped.add(k);
    try{ localStorage.setItem(SKIP_KEY, JSON.stringify([...skipped])); }catch(err){}
    render();
  });
  $("notionClear").addEventListener("click", () => {
    saveNotion(null); $("load").value = 0; $("loadHard").value = 0;
    renderNotionNote(); render();
  });
  setDefaultDeadline();
  document.querySelectorAll("#settingsBox input:not(#linkPaste), #settingsBox select").forEach(el => el.addEventListener("input", () => { saveSettings(readSettings()); setDefaultDeadline(); renderCal(); render(); }));
  ["qDouga","qShiage","qGentore","qGen","reGenH","jobType","cpxD","cpxA","load","loadHard","gaichu","part","redo","hasRisk"].forEach(id => $(id).addEventListener("input", render));
  $("deadline").addEventListener("input", () => { deadlineTouched = true; renderCal(); render(); });
  $("cal").addEventListener("click", e => {
    const b = e.target.closest("button[data-d]"); if(!b) return;
    const k = b.dataset.d;
    dayOverride[k] = !isOff(new Date(k + "T00:00"));
    saveOff(); renderCal(); render();
  });
  // Inside a Notion embed, clicking the link opens a separate tab with its own storage, so the link can be pasted here instead
  $("linkPaste").addEventListener("input", () => {
    const v = $("linkPaste").value.trim(); if(!v) return;
    const query = v.includes("?") ? v.slice(v.indexOf("?")) : v;
    const s = readSettings(), n = takeLinkSpeeds(query, s), snap = parseNotion(query), h = takeHist(query, s);
    if(!n && !snap && !h){ $("savedNote").textContent = t("noLink"); return; }
    if(n || (h && h.fitted)){ writeSettings(s); saveSettings(s); buildGrid(); writeSettings(s); }
    if(snap){ saveNotion(snap); applyNotion(); renderNotionNote(); }
    $("savedNote").textContent = [n ? t("fromLink")(n) : "", h ? (h.fitted ? t("fromHist")(h.n) : t("modelFew")(h.n)) : "", !n && !h ? t("fromNotion") : ""].filter(Boolean).join(" "); $("linkPaste").value = "";
    setDefaultDeadline(); renderCal(); render();
  });
  $("reset").addEventListener("click", () => {
    model = null; try{ localStorage.removeItem(MODEL_KEY); }catch(e){}
    buildGrid(); writeSettings({...DEFAULTS}); saveSettings(readSettings()); render();
  });
  country = loadCountry(); renderCountries();
  $("country").addEventListener("change", () => {
    country = $("country").value;
    try{ localStorage.setItem(COUNTRY_KEY, country); }catch(e){}
    loadHolidays();
  });
  const y = new Date().getFullYear();
  $("csvYear").innerHTML = [y, y + 1].map(v => `<option value="${v}">${v}</option>`).join("");
  $("csvBtn").addEventListener("click", downloadCsv);
  renderCal(); render();
  if(linkNote){ $("savedNote").textContent = linkNote; $("settingsBox").open = true; }
  loadHolidays();
}
init();
</script>
